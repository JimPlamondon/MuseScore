name: 'Check: Codestyle'

on:
  # musescore-jims: run on pushes to the integration and task branches too.
  push:
    branches:
      - jims/main
      - 'claude/**'
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  codestyle:
    # musescore-jims: self-contained — the upstream fetch of checkcodestyle
    # scripts from musescore/framework_tmp no longer resolves (that repo moved
    # into the muse submodule). Run this repository's own tools/codestyle
    # (uncrustify_musescore.cfg targets uncrustify 0.72, which is what
    # ubuntu-22.04's apt package provides) and fail on any resulting diff.
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Install uncrustify
      run: |
        sudo apt-get update
        sudo apt-get install -y uncrustify
        uncrustify --version

    - name: Test coding style
      run: |
        bash ./tools/codestyle/uncrustify_run_dir.sh ./src
        if ! git diff --quiet; then
          echo "::error::Code style is incorrect in these files:"
          git diff --name-only
          echo "Run tools/codestyle/uncrustify_run_file.sh on them and amend."
          git diff
          exit 1
        fi

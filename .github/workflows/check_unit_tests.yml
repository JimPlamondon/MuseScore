name: 'Check: Unit Tests (utest)'

on:
  # musescore-jims: we integrate by fast-forwarding jims/main (no PRs), so
  # run on pushes to the integration branch and the agents' task branches.
  push:
    branches:
      - jims/main
      - 'claude/**'
      - 'codex/**'
  pull_request:
  workflow_dispatch:
    inputs:
      code_coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 4" # Every Thursday night at 03:00 for master branch

jobs:
  run_tests:
    runs-on: ubuntu-22.04
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.13.0
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v6
    - name: "Configure workflow"
      run: |
        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-utests-ccache-
        restore-keys: |
          ${{runner.os}}-${{runner.arch}}-utests-ccache-
          ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh

    # musescore-jims: the engraving module links the JiMS Kernel's
    # jims-musescore-bridge staticlib (built by cargo during CMake configure,
    # see src/engraving/jims/SetupJiMSBridge.cmake). The Kernel repository is
    # private: JIMS_KERNEL_TOKEN is a fine-grained PAT with read-only
    # Contents access to JimPlamondon/jims, stored as a repository secret.
    - name: Clone JiMS Kernel (jims)
      uses: actions/checkout@v6
      with:
        repository: JimPlamondon/jims
        ref: main
        token: ${{ secrets.JIMS_KERNEL_TOKEN }}
        path: jims-kernel
    - name: Setup Rust (JiMS bridge)
      uses: dtolnay/rust-toolchain@stable
    - name: Point the build at the Kernel
      run: |
        echo "JIMS_ROOT=${{ github.workspace }}/jims-kernel" | tee -a $GITHUB_ENV
        cargo --version

    - name: Build
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CODE_COVERAGE: ${{ inputs.code_coverage }}
      run: |
        mkdir -p build.artifacts/env

        ENABLE_CODE_COVERAGE='false'

        if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$CODE_COVERAGE" == true ]]; then
          ENABLE_CODE_COVERAGE='true'
        else
          ENABLE_CODE_COVERAGE='false'
        fi

        bash ./buildscripts/ci/linux/build_utest.sh -n ${{ env.BUILD_NUMBER }} --enable_code_coverage ${ENABLE_CODE_COVERAGE}

    - name: Show ccache stats
      run: |
        ccache -sv
    - name: Run tests
      run: |
        bash ./buildscripts/ci/linux/runutests.sh
      env:
        ASAN_OPTIONS: "detect_leaks=0"

    - name: Code coverage
      if: ( github.event_name == 'schedule' || inputs.code_coverage ) && github.repository == 'musescore/MuseScore'
      run: |
        lcov --capture --directory "$(pwd)/build.debug/" --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/thirdparty/*' '*/moc_*' '*framework/Headers/*' '*/hb-*' '*/Qt/*' --output-file filtered_coverage.info

        python3 buildscripts/ci/linux/tools/lcov_badger.py filtered_coverage.info coverage_badge.svg

    - name: Push to S3
      if: ( github.event_name == 'schedule' || inputs.code_coverage ) && github.repository == 'musescore/MuseScore'
      run: |
        S3_URL='s3://extensions.musescore.org/test/code_coverage/coverage_badge.svg'

        bash ./buildscripts/ci/tools/s3_push_file.sh \
          --s3_key '${{ secrets.S3_KEY }}' \
          --s3_secret '${{ secrets.S3_SECRET }}' \
          --s3_url "${S3_URL}" \
          --file_path "coverage_badge.svg"

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache
